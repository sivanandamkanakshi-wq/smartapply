databases:
  - name: smartapply-db
    plan: free

services:
  - type: web
    name: smartapply
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m flask db upgrade"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: smartapply-db
          property: connectionString